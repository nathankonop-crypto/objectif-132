<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2747c9"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Objectif 132"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Objectif 132</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout : feuille de réponses — une colonne étroite, bulles (1)(2)(3)(4) comme sur la fiche du NITE, barre d'onglets en bas */
:root{
  --paper:#f6f7f9; --card:#ffffff; --ink:#18212f; --muted:#5d6878; --line:#d9dee7;
  --accent:#2747c9; --accent-soft:#e6ebfb; --on-accent:#ffffff; --ok:#147a4b; --ok-soft:#e1f3ea; --bad:#b4282f; --bad-soft:#fbe6e7; --mark:#d99a00; --mid:#8a5a00; --mid-soft:#fbf0d6;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151c; --card:#1a2029; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2c3440;
  --accent:#8ea6ff; --accent-soft:#232c45; --on-accent:#0d1220; --ok:#5fd09a; --ok-soft:#173226; --bad:#ff8a8f; --bad-soft:#3a1d21; --mark:#f2c94c; --mid:#f2c94c; --mid-soft:#352c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151c; --card:#1a2029; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2c3440;
  --accent:#8ea6ff; --accent-soft:#232c45; --on-accent:#0d1220; --ok:#5fd09a; --ok-soft:#173226; --bad:#ff8a8f; --bad-soft:#3a1d21; --mark:#f2c94c; --mid:#f2c94c; --mid-soft:#352c14; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs a{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:500}
.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* en-têtes de page */
.ph{padding-block:22px 12px;display:grid;gap:4px}
.ph h1{font-size:28px;line-height:1.15}
.ph p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;min-width:0}
.stat b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sec{margin-top:18px;display:grid;gap:8px}
.sec>h2{font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item:hover{border-color:var(--accent)}
.item .num{font-family:var(--f-mono);font-weight:600;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:14px}
.item .txt{min-width:0}
.item .txt b{display:block;font-weight:600}
.item .txt small{color:var(--muted);font-size:13px}
.pill{font-family:var(--f-mono);font-size:13px;padding:3px 9px;border-radius:99px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.mid{background:var(--mid-soft);color:var(--mid);border-color:transparent}
.pill.low{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:transparent;padding:10px 8px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.primary{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:14px;font-weight:600;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.secondary{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;cursor:pointer;text-align:center;text-decoration:none;color:inherit;display:block}
.danger{border:0;background:var(--bad);color:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:12px;display:grid;gap:8px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted)}

/* planning */
.goal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.goal .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.goal.done .chk{background:var(--ok);border-color:var(--ok)}
.goal.done .chk::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--card);border-bottom:2.5px solid var(--card);transform:rotate(-45deg) translate(1px,-1px)}
.goal.done b{text-decoration:line-through;text-decoration-color:var(--muted)}
.goal b{font-weight:600;display:block}
.goal small{color:var(--muted);font-size:13px}
.goal .go{font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap}
.phases{display:grid;gap:6px}
.phase{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start}
.phase .dot{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--line)}
.phase.now .dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.phase.past{color:var(--muted)}
.phase b{font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

/* quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;text-decoration:none;color:inherit;white-space:nowrap}
.bar .t{flex:1;min-width:0}
.bar .t b{display:block;font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t small{color:var(--muted);font-size:12px}
.timer{font-family:var(--f-mono);font-size:15px;padding:4px 8px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.over{color:var(--bad);border-color:var(--bad)}
.part-head{font-family:var(--f-display);font-size:15px;margin-block:18px 8px;color:var(--accent)}
.intro{margin:0 0 8px;color:var(--muted);font-size:14px}
.tablewrap{overflow-x:auto;margin-bottom:6px}
table.data{border-collapse:collapse;font-size:14px;background:var(--card);min-width:100%}
table.data th,table.data td{border:1px solid var(--line);padding:6px 10px;text-align:center;font-variant-numeric:tabular-nums}
table.data th{background:var(--accent-soft)}
table.data td:first-child,table.data th:first-child{text-align:left;font-weight:600}
.note{font-size:13px;font-style:italic;color:var(--muted);margin:4px 0 10px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.chart svg,.fig svg{width:100%;height:auto;display:block}
.fig{max-width:300px;margin:10px 0 2px}
.fig svg *{vector-effect:non-scaling-stroke}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.q.ok{border-color:var(--ok)} .q.bad{border-color:var(--bad)}
.q .head{display:grid;grid-template-columns:auto 1fr;gap:10px}
.q .n{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.q .text{min-width:0}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px}
.opt .bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.opt .lab{min-width:0}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .bub{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt:disabled{cursor:default}
.expl{margin-top:10px;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--paper);border-left:3px solid var(--mark);display:grid;gap:6px}
.expl b{font-family:var(--f-mono)}
.tip{font-size:14px}
.tip strong{color:var(--accent)}
.ask{display:grid;gap:6px}
.ask .out{white-space:pre-wrap;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
.askbtn{justify-self:start;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.actions{display:grid;gap:8px;margin-top:16px}
.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px;margin-bottom:14px}
.result .big{font-family:var(--f-mono);font-size:40px;font-weight:600;line-height:1}
.result p{margin:0;color:var(--muted)}

/* calcul mental */
.drill{display:grid;gap:14px;justify-items:center;text-align:center;padding-top:20px}
.drill .prompt{font-family:var(--f-mono);font-size:42px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.drill input{width:100%;max-width:260px;font-family:var(--f-mono);font-size:30px;text-align:center;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.drill input.ok{border-color:var(--ok);background:var(--ok-soft)}
.drill input.bad{border-color:var(--bad);background:var(--bad-soft)}
.drill .fb{min-height:24px;font-weight:600}
.drill .fb.ok{color:var(--ok)} .drill .fb.bad{color:var(--bad)}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden;width:100%}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* cartes */
.flash{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;min-height:220px;display:grid;align-content:center;gap:12px;text-align:center}
.flash .front{font-family:var(--f-display);font-size:22px;line-height:1.3}
.flash .back{font-size:18px;border-top:1px dashed var(--line);padding-top:12px}
.flash .back b{font-family:var(--f-mono)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.boxes div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:12px;color:var(--muted)}
.boxes b{display:block;font-family:var(--f-mono);font-size:17px;color:var(--ink)}

/* stats */
.hbar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:10px;align-items:center;font-size:14px}
.hbar .track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:99px}
.hbar .v{font-family:var(--f-mono);font-size:13px;min-width:5.5em;text-align:right;font-variant-numeric:tabular-nums}
.est{display:grid;gap:4px}
.est .big{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px;font-family:var(--f-mono);font-size:12px;word-break:break-all}
.status{display:flex;gap:8px;align-items:center;font-size:14px}
.status i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.status.on i{background:var(--ok)} .status.warn i{background:var(--mark)}
sup,sub{line-height:0}
@media (prefers-reduced-motion:no-preference){.opt,.item,.goal{transition:border-color .15s,background .15s}}
</style>

<script id="data" type="application/json">[{"id": "f1", "title": "Nombres et calcul", "sub": "15 questions · 15 minutes", "parts": [{"q": [{"t": "3/4 − 2/3 = ?", "o": ["1/6", "1/7", "1/12", "5/12"], "a": 3, "e": "9/12 − 8/12 = 1/12."}, {"t": "Combien de nombres entiers sont compris entre −3,5 et 4,2 ?", "o": ["6", "8", "9", "7"], "a": 2, "e": "−3, −2, −1, 0, 1, 2, 3, 4 → 8 nombres."}, {"t": "a est un nombre entier impair.<br>Lequel des nombres suivants est nécessairement pair ?", "o": ["a² + 2", "2a + 1", "a² + a", "3a"], "a": 3, "e": "a² est impair, a est impair : impair + impair = pair."}, {"t": "2<sup>10</sup> − 2<sup>9</sup> = ?", "o": ["1", "2<sup>9</sup>", "2<sup>19</sup>", "2"], "a": 2, "e": "2<sup>10</sup> = 2·2<sup>9</sup>, donc 2·2<sup>9</sup> − 2<sup>9</sup> = 2<sup>9</sup>."}, {"t": "Quel est le plus petit nombre entier positif divisible à la fois par 6, par 8 et par 10 ?", "o": ["120", "240", "60", "480"], "a": 1, "e": "PPCM : 6 = 2·3, 8 = 2³, 10 = 2·5 → 2³·3·5 = 120."}, {"t": "Donnée : x = 0,5<br>Lequel des ordres suivants est correct ?", "o": ["√x &lt; x &lt; x² &lt; 1/x", "x &lt; x² &lt; √x &lt; 1/x", "1/x &lt; x² &lt; x &lt; √x", "x² &lt; x &lt; √x &lt; 1/x"], "a": 4, "e": "x² = 0,25 ; x = 0,5 ; √x ≈ 0,71 ; 1/x = 2. Entre 0 et 1 : x² &lt; x &lt; √x."}, {"t": "a et b sont deux nombres premiers différents, et a + b = 15.<br>a · b = ?", "o": ["54", "44", "56", "26"], "a": 4, "e": "Une somme impaire de 2 premiers impose que l'un soit 2 (seul premier pair) : 2 + 13 → 26."}, {"t": "(−1)<sup>25</sup> + (−1)<sup>24</sup> + (−1)<sup>23</sup> = ?", "o": ["1", "−1", "3", "−3"], "a": 2, "e": "Puissance impaire → −1, paire → +1 : −1 + 1 − 1 = −1."}, {"t": "Le reste de la division de n par 7 est 5.<br>Quel est le reste de la division de 3n par 7 ?", "o": ["3", "1", "5", "6"], "a": 2, "e": "Prends n = 5 : 3n = 15 = 2·7 + 1 → reste 1."}, {"t": "Combien de diviseurs positifs le nombre 72 a-t-il ?", "o": ["10", "12", "14", "8"], "a": 2, "e": "72 = 2³·3² → (3+1)(2+1) = 12."}, {"t": "(√12 + √27)² = ?", "o": ["75", "81", "39", "45"], "a": 1, "e": "√12 = 2√3, √27 = 3√3 → (5√3)² = 25·3 = 75."}, {"t": "Donnée : a &lt; 0 &lt; b<br>Laquelle des expressions suivantes est nécessairement positive ?", "o": ["a · b", "a² − b²", "a + b", "b − a"], "a": 4, "e": "b − a = positif + |a| &gt; 0. Les autres dépendent des valeurs ou sont négatives."}, {"t": "3<sup>x</sup> · 9 = 27² <br>x = ?", "o": ["2", "8", "4", "6"], "a": 3, "e": "3<sup>x+2</sup> = 3<sup>6</sup> → x = 4."}, {"t": "n est un nombre entier tel que n/4 est un nombre impair.<br>Laquelle des affirmations suivantes est nécessairement vraie ?", "o": ["n est divisible par 8", "n + 4 est divisible par 8", "n/2 est un nombre impair", "n est divisible par 12"], "a": 2, "e": "n = 4k (k impair). n + 4 = 4(k + 1), et k + 1 est pair → divisible par 8. Essaie n = 4 : 8 oui ; n = 12 : 16 oui."}, {"t": "Combien de nombres entiers de 1 à 100 (inclus) ne sont divisibles ni par 2 ni par 5 ?", "o": ["50", "30", "45", "40"], "a": 4, "e": "100 − 50 (pairs) − 20 (multiples de 5) + 10 (multiples de 10 comptés deux fois) = 40."}]}]}, {"id": "f2", "title": "Algèbre", "sub": "15 questions · 15 minutes", "parts": [{"q": [{"t": "3x − 7 = 2x + 5<br>x = ?", "o": ["−2", "−12", "12", "2"], "a": 3, "e": "3x − 2x = 5 + 7 → x = 12."}, {"t": "Donnée : 2a + 3 = 11<br>4a + 6 = ?", "o": ["25", "14", "22", "19"], "a": 3, "e": "4a + 6 = 2·(2a + 3) = 22. Pas besoin de trouver a !"}, {"t": "(x + 3)² − (x − 3)² = ?", "o": ["6x", "0", "12x", "18"], "a": 3, "e": "(x² + 6x + 9) − (x² − 6x + 9) = 12x."}, {"t": "Données : x + y = 10 et x − y = 4<br>x · y = ?", "o": ["21", "16", "40", "24"], "a": 1, "e": "On additionne : 2x = 14 → x = 7, y = 3 → 21."}, {"t": "On définit l'opération a # b = a² − 2b.<br>3 # (2 # 1) = ?", "o": ["1", "5", "7", "3"], "a": 2, "e": "2 # 1 = 4 − 2 = 2, puis 3 # 2 = 9 − 4 = 5."}, {"t": "Pour quelles valeurs de x a-t-on −3x + 6 &gt; 0 ?", "o": ["x &lt; 2", "x &gt; 2", "x &lt; −2", "x &gt; −2"], "a": 1, "e": "−3x &gt; −6 → on divise par −3 et on inverse : x &lt; 2."}, {"t": "Quelle est la somme des solutions de l'équation x² − 7x + 10 = 0 ?", "o": ["7", "3", "10", "−7"], "a": 1, "e": "Somme = −b/a = 7 (les solutions sont 2 et 5)."}, {"t": "(x² − 9) / (x + 3) = ?     (x ≠ −3)", "o": ["3 − x", "x + 3", "x − 3", "x − 9"], "a": 3, "e": "x² − 9 = (x − 3)(x + 3)."}, {"t": "Donnée : x/y = 3/4<br>(x + y)/y = ?", "o": ["4/7", "7/4", "3/7", "7/3"], "a": 2, "e": "(x + y)/y = x/y + 1 = 3/4 + 1 = 7/4."}, {"t": "Quelle est la somme des solutions de l'équation |x − 2| = 5 ?", "o": ["4", "−4", "7", "10"], "a": 1, "e": "x − 2 = 5 → x = 7 ; x − 2 = −5 → x = −3. Somme 4."}, {"t": "Données : a · b = 12 et a² + b² = 25<br>(a + b)² = ?", "o": ["49", "37", "61", "144"], "a": 1, "e": "(a + b)² = a² + b² + 2ab = 25 + 24 = 49."}, {"t": "Donnée : 2<sup>x</sup> = 5<br>2<sup>x+3</sup> = ?", "o": ["40", "8", "15", "125"], "a": 1, "e": "2<sup>x+3</sup> = 2<sup>x</sup>·2³ = 5·8 = 40."}, {"t": "Un stylo coûte a shekels et un cahier coûte 3 shekels de plus qu'un stylo.<br>Combien coûtent ensemble 2 stylos et 3 cahiers ?", "o": ["5a + 3", "5a + 9", "6a + 9", "5a + 6"], "a": 2, "e": "2a + 3(a + 3) = 5a + 9."}, {"t": "Donnée : x + 1/x = 4<br>x² + 1/x² = ?", "o": ["14", "16", "18", "12"], "a": 1, "e": "(x + 1/x)² = x² + 2 + 1/x² = 16 → x² + 1/x² = 14."}, {"t": "Donnée : a &gt; b &gt; 0<br>Laquelle des expressions suivantes est nécessairement négative ?", "o": ["a/b − 1", "(a − b)²", "a² − b²", "(b − a)/(a + b)"], "a": 4, "e": "b − a &lt; 0 et a + b &gt; 0 → quotient négatif."}]}]}, {"id": "f3", "title": "Pourcentages et proportions", "sub": "15 questions · 15 minutes", "parts": [{"q": [{"t": "Un article coûte 80 shekels. Quel est son prix après une réduction de 15 % ?", "o": ["72", "75", "68", "65"], "a": 3, "e": "80 × 0,85 = 68."}, {"t": "30 % de 40 % de 500 = ?", "o": ["35", "70", "60", "120"], "a": 3, "e": "0,3 × 0,4 × 500 = 0,12 × 500 = 60."}, {"t": "Le prix d'un article augmente de 20 %, puis baisse de 20 %.<br>Par rapport au prix initial, le prix final est :", "o": ["identique", "supérieur de 4 %", "inférieur de 4 %", "inférieur de 2 %"], "a": 3, "e": "1,2 × 0,8 = 0,96 → −4 %."}, {"t": "Un salaire passe de 8000 à 9000 shekels. De quel pourcentage a-t-il augmenté ?", "o": ["13 %", "12,5 %", "10 %", "environ 11,1 %"], "a": 2, "e": "1000/8000 = 1/8 = 12,5 %. On divise par l'ANCIENNE valeur."}, {"t": "Dans une classe de 32 élèves, le rapport entre le nombre de garçons et le nombre de filles est de 3 : 5.<br>Combien y a-t-il de filles ?", "o": ["20", "15", "12", "24"], "a": 1, "e": "8 parts de 4 élèves → filles = 5 × 4 = 20."}, {"t": "Après une hausse de 25 %, un article coûte 150 shekels. Quel était son prix initial ?", "o": ["130", "125", "120", "112,5"], "a": 3, "e": "150 / 1,25 = 120."}, {"t": "A est plus grand que B de 25 %.<br>De quel pourcentage B est-il plus petit que A ?", "o": ["25 %", "30 %", "75 %", "20 %"], "a": 4, "e": "Prends B = 100, A = 125 : 25/125 = 20 %."}, {"t": "Une recette demande 3 œufs pour 250 g de farine. Combien d'œufs faut-il pour 1 kg de farine ?", "o": ["9", "12", "10", "15"], "a": 2, "e": "1 kg = 4 × 250 g → 4 × 3 = 12."}, {"t": "6 ouvriers construisent un mur en 10 jours. Combien de jours faut-il à 4 ouvriers travaillant au même rythme ?", "o": ["12", "6⅔", "20", "15"], "a": 4, "e": "Proportionnalité inverse : 6 × 10 = 60 jours-ouvrier → 60/4 = 15."}, {"t": "Une ville compte 2000 habitants. Sa population augmente de 10 % chaque année. Combien d'habitants aura-t-elle dans 2 ans ?", "o": ["2400", "2200", "2440", "2420"], "a": 4, "e": "2000 × 1,1 × 1,1 = 2420 (pas 2400 : la 2ᵉ hausse porte sur 2200)."}, {"t": "Donnée : x % de y = 30<br>y % de x = ?", "o": ["300", "30", "0,3", "Impossible à déterminer"], "a": 2, "e": "x·y/100 dans les deux cas → 30."}, {"t": "Un récipient contient 40 litres d'un mélange contenant 25 % de sucre. Combien de litres d'eau faut-il ajouter pour que le mélange contienne 20 % de sucre ?", "o": ["8", "12", "5", "10"], "a": 4, "e": "Sucre = 10 L. 10/(40 + w) = 0,2 → 40 + w = 50 → w = 10."}, {"t": "Données : a : b = 2 : 3 et b : c = 4 : 5<br>a : c = ?", "o": ["2 : 5", "3 : 5", "10 : 12", "8 : 15"], "a": 4, "e": "On rend b commun : a : b = 8 : 12 et b : c = 12 : 15 → a : c = 8 : 15."}, {"t": "Le prix p d'un article augmente de 50 %. De quel pourcentage faut-il ensuite baisser le nouveau prix pour revenir à p ?", "o": ["66⅔ %", "50 %", "25 %", "33⅓ %"], "a": 4, "e": "1,5p → p : on enlève 0,5p sur 1,5p = 1/3."}, {"t": "Dans un groupe, 60 % des personnes sont des femmes. 25 % des femmes et 50 % des hommes portent des lunettes.<br>Quel pourcentage du groupe porte des lunettes ?", "o": ["75 %", "40 %", "37,5 %", "35 %"], "a": 4, "e": "0,6 × 0,25 + 0,4 × 0,5 = 0,15 + 0,2 = 35 %."}]}]}, {"id": "f4", "title": "Problèmes : vitesse, travail, âges", "sub": "15 questions · 18 minutes", "parts": [{"q": [{"t": "Un train parcourt 240 km en 3 heures. Quelle est sa vitesse (en km/h) ?", "o": ["60", "90", "72", "80"], "a": 4, "e": "240 / 3 = 80."}, {"t": "Une voiture roule à 90 km/h pendant 40 minutes. Quelle distance (en km) parcourt-elle ?", "o": ["36", "50", "60", "65"], "a": 3, "e": "40 min = 2/3 h → 90 × 2/3 = 60."}, {"t": "Une voiture fait l'aller à 60 km/h et le retour, sur la même route, à 30 km/h.<br>Quelle est sa vitesse moyenne sur l'ensemble du trajet (en km/h) ?", "o": ["40", "50", "45", "42"], "a": 1, "e": "Prends 60 km : aller 1 h, retour 2 h → 120 km / 3 h = 40. (Pas 45 !)"}, {"t": "Deux villes sont distantes de 300 km. Deux voitures partent en même temps, chacune d'une ville, l'une vers l'autre, à 70 km/h et 80 km/h.<br>Après combien d'heures se croisent-elles ?", "o": ["2", "2,5", "1,5", "3"], "a": 1, "e": "Sens opposés : on additionne les vitesses → 300 / 150 = 2."}, {"t": "Le robinet A remplit un bassin en 6 heures, le robinet B en 3 heures.<br>En combien d'heures les deux robinets ensemble remplissent-ils le bassin ?", "o": ["2", "4,5", "1,5", "9"], "a": 1, "e": "1/6 + 1/3 = 1/2 du bassin par heure → 2 heures."}, {"t": "Dani a 3 fois l'âge de son fils. Dans 12 ans, il aura 2 fois l'âge de son fils.<br>Quel est l'âge actuel du fils ?", "o": ["8", "12", "10", "15"], "a": 2, "e": "3f + 12 = 2(f + 12) → f = 12. Vérif : 36 et 12 ; dans 12 ans 48 et 24 oui."}, {"t": "La somme de trois nombres entiers consécutifs est 72. Quel est le plus grand des trois ?", "o": ["24", "23", "26", "25"], "a": 4, "e": "Le milieu = 72/3 = 24 → 23, 24, 25."}, {"t": "Un cycliste roule à la vitesse v pendant t heures, puis à la vitesse 2v pendant t heures.<br>Quelle distance totale a-t-il parcourue ?", "o": ["4vt", "2vt", "3v/t", "3vt"], "a": 4, "e": "vt + 2v·t = 3vt."}, {"t": "Ouvrier A fait un travail seul en 4 heures. A et B ensemble le font en 3 heures.<br>En combien d'heures B le fait-il seul ?", "o": ["1", "12", "6", "7"], "a": 2, "e": "1/3 − 1/4 = 1/12 → 12 heures."}, {"t": "Un robinet remplit une piscine en 4 heures. Une évacuation la vide en 6 heures.<br>Si la piscine est vide et que les deux sont ouverts, en combien d'heures sera-t-elle pleine ?", "o": ["5", "12", "2", "10"], "a": 2, "e": "1/4 − 1/6 = 1/12 → 12 heures (on SOUSTRAIT l'évacuation)."}, {"t": "Un coureur parcourt 400 mètres en 50 secondes. Quelle est sa vitesse en km/h ?", "o": ["30", "24", "28,8", "32"], "a": 3, "e": "8 m/s × 3,6 = 28,8 km/h."}, {"t": "Un bus part à 8h00 à 60 km/h. Une voiture part du même endroit à 9h00, sur la même route, à 90 km/h.<br>À quelle heure la voiture rattrape-t-elle le bus ?", "o": ["10h00", "12h00", "11h00", "10h30"], "a": 3, "e": "À 9h00 le bus a 60 km d'avance. Écart réduit de 30 km/h → 2 h → 11h00."}, {"t": "Adam fait un travail en a heures et Benny en b heures.<br>En combien d'heures le font-ils ensemble ?", "o": ["(a + b)/2", "ab/(a + b)", "a + b", "(a + b)/ab"], "a": 2, "e": "1/a + 1/b = (a + b)/ab par heure → temps = ab/(a + b). Vérifie avec a = b = 2 → 1 h oui."}, {"t": "Un billet adulte coûte 40 shekels, un billet enfant 25 shekels. Une famille achète 12 billets pour 405 shekels.<br>Combien de billets enfant a-t-elle achetés ?", "o": ["8", "5", "4", "7"], "a": 2, "e": "Si tous enfants : 300. Il manque 105, chaque adulte ajoute 15 → 7 adultes, 5 enfants."}, {"t": "Il faut 60 secondes pour monter à pied un escalier roulant arrêté, et 40 secondes pour monter en restant immobile sur l'escalier en marche.<br>Combien de secondes faut-il pour monter à pied sur l'escalier en marche ?", "o": ["50", "100", "20", "24"], "a": 4, "e": "C'est un problème de travail : 1/60 + 1/40 = 5/120 = 1/24 → 24 s."}]}]}, {"id": "f5", "title": "Moyennes, combinatoire, probabilités", "sub": "15 questions · 15 minutes", "parts": [{"q": [{"t": "Quelle est la moyenne des nombres 4, 7, 10 et 15 ?", "o": ["8", "9", "10", "9,5"], "a": 2, "e": "36 / 4 = 9."}, {"t": "La moyenne de 5 nombres est 20. On enlève l'un d'eux et la moyenne des 4 nombres restants est 18.<br>Quel nombre a été enlevé ?", "o": ["30", "22", "28", "24"], "a": 3, "e": "Somme = 100, puis 72 → 100 − 72 = 28."}, {"t": "Quelle est la médiane des nombres 3, 9, 1, 7, 12, 4 ?", "o": ["4", "7", "6", "5,5"], "a": 4, "e": "Dans l'ordre : 1, 3, 4, 7, 9, 12 → (4 + 7)/2 = 5,5."}, {"t": "La moyenne de a et b est 12. La moyenne de a, b et c est 15.<br>c = ?", "o": ["27", "21", "18", "24"], "a": 2, "e": "a + b = 24 ; a + b + c = 45 → c = 21."}, {"t": "Une classe de 20 élèves a une moyenne de 70, une autre classe de 30 élèves a une moyenne de 80.<br>Quelle est la moyenne des 50 élèves ?", "o": ["76", "74", "78", "75"], "a": 1, "e": "(1400 + 2400)/50 = 76. Plus proche de 80 car la classe B est plus grande."}, {"t": "On lance une pièce 3 fois. Quelle est la probabilité d'obtenir exactement 2 fois pile ?", "o": ["2/3", "1/2", "3/8", "1/4"], "a": 3, "e": "8 résultats ; PPF, PFP, FPP → 3/8."}, {"t": "Un sac contient 4 boules rouges et 6 boules bleues. On tire une boule au hasard. Quelle est la probabilité qu'elle soit bleue ?", "o": ["2/5", "1/6", "2/3", "3/5"], "a": 4, "e": "6/10 = 3/5."}, {"t": "De combien de façons peut-on asseoir 4 personnes sur 4 chaises placées en ligne ?", "o": ["16", "24", "4", "12"], "a": 2, "e": "4! = 24."}, {"t": "Combien de comités de 2 personnes peut-on former dans un groupe de 6 personnes ?", "o": ["12", "15", "36", "30"], "a": 2, "e": "Sans ordre : 6 × 5 / 2 = 15."}, {"t": "On lance deux dés. Quelle est la probabilité que la somme soit 8 ?", "o": ["1/6", "1/9", "7/36", "5/36"], "a": 4, "e": "(2,6) (3,5) (4,4) (5,3) (6,2) → 5/36."}, {"t": "Combien de codes de 3 chiffres (de 0 à 9) peut-on former si les trois chiffres doivent être différents ?", "o": ["720", "504", "1000", "120"], "a": 1, "e": "10 × 9 × 8 = 720 (l'ordre compte dans un code)."}, {"t": "Un sac contient 3 boules rouges et 2 bleues. On tire 2 boules sans remise.<br>Quelle est la probabilité que les deux soient rouges ?", "o": ["3/5", "9/25", "1/5", "3/10"], "a": 4, "e": "3/5 × 2/4 = 6/20 = 3/10."}, {"t": "On lance une pièce 3 fois. Quelle est la probabilité d'obtenir au moins une fois pile ?", "o": ["1/8", "7/8", "3/8", "1/2"], "a": 2, "e": "1 − P(aucun pile) = 1 − 1/8 = 7/8."}, {"t": "La moyenne de 10 nombres est 8. On ajoute 3 à chacun des nombres, puis on multiplie chaque résultat par 2.<br>Quelle est la nouvelle moyenne ?", "o": ["22", "16", "11", "19"], "a": 1, "e": "(8 + 3) × 2 = 22. La moyenne subit les mêmes opérations."}, {"t": "Combien de nombres de 3 chiffres, formés uniquement avec les chiffres 1, 2 et 3 (répétitions permises), sont pairs ?", "o": ["6", "18", "9", "27"], "a": 3, "e": "Le dernier chiffre doit être 2 : 3 × 3 × 1 = 9."}]}]}, {"id": "f6", "title": "Géométrie plane", "sub": "15 questions · 18 minutes · Fais un croquis à chaque question !", "parts": [{"q": [{"t": "Dans un triangle, deux des angles mesurent 50° et 65°. Combien mesure le troisième angle ?", "o": ["65°", "75°", "55°", "60°"], "a": 1, "e": "180 − 50 − 65 = 65°."}, {"t": "Si on double la longueur du côté d'un carré, son aire est multipliée par :", "o": ["4", "8", "16", "2"], "a": 1, "e": "Longueurs × 2 → aires × 2² = 4."}, {"t": "Un rectangle mesure 8 cm sur 6 cm. Quelle est la longueur de sa diagonale (en cm) ?", "o": ["12", "48", "10", "14"], "a": 3, "e": "Triplet 6-8-10."}, {"t": "Combien mesure chaque angle intérieur d'un hexagone régulier ?", "o": ["135°", "144°", "120°", "108°"], "a": 3, "e": "(6 − 2) × 180 / 6 = 120°."}, {"t": "Quelle est l'aire d'un cercle de rayon 5 ?", "o": ["5π", "10π", "100π", "25π"], "a": 4, "e": "π × 5² = 25π."}, {"t": "L'aire d'un carré est 50 cm². Quelle est la longueur de sa diagonale (en cm) ?", "o": ["25", "5√2", "10√2", "10"], "a": 4, "e": "Aire d'un carré = diagonale²/2 → d² = 100 → d = 10."}, {"t": "Les côtés de l'angle droit d'un triangle rectangle mesurent 5 et 12. Quel est le périmètre du triangle ?", "o": ["17", "25", "30", "60"], "a": 3, "e": "Triplet 5-12-13 → 5 + 12 + 13 = 30."}, {"t": "Un trapèze a des bases de 6 et 10 et une hauteur de 5. Quelle est son aire ?", "o": ["80", "40", "30", "50"], "a": 2, "e": "(6 + 10) × 5 / 2 = 40."}, {"t": "Deux droites parallèles sont coupées par une sécante. L'un des angles formés mesure 70°.<br>Lequel des nombres suivants peut aussi être la mesure d'un des angles formés ?", "o": ["140°", "110°", "90°", "20°"], "a": 2, "e": "Tous les angles formés valent 70° ou 180 − 70 = 110°."}, {"t": "Deux côtés d'un triangle mesurent 4 et 9. Lequel des nombres suivants peut être la longueur du troisième côté ?", "o": ["4", "5", "11", "13"], "a": 3, "e": "Inégalité triangulaire : 9 − 4 &lt; c &lt; 9 + 4 → 5 &lt; c &lt; 13."}, {"t": "Dans un triangle rectangle, un angle mesure 30° et l'hypoténuse mesure 10.<br>Quelle est la longueur du côté opposé à l'angle de 60° ?", "o": ["5", "5√3", "10√3", "5√2"], "a": 2, "e": "30-60-90 : 1 : √3 : 2 → côtés 5 (face à 30°) et 5√3 (face à 60°)."}, {"t": "Dans un cercle, un angle au centre mesure 80°. Combien mesure un angle inscrit qui intercepte le même arc ?", "o": ["100°", "160°", "40°", "80°"], "a": 3, "e": "Angle inscrit = moitié de l'angl /* ====== Générateurs d'exercices (nouveaux nombres à chaque fois) ====== */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const lcm = (a, b) => a / gcd(a, b) * b;
function shuffleArr(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function nf(x, d = 2) {
  const r = Math.round(x * 10 ** d) / 10 ** d;
  let s = Math.abs(r).toFixed(d); if (s.includes(".")) s = s.replace(/\.?0+$/, "");
  let [i, f] = s.split(".");
  if (i.length > 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (r < 0 ? "−" : "") + i + (f ? "," + f : "");
}
function frac(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); n /= g; d /= g; return d === 1 ? nf(n) : (n < 0 ? "−" : "") + Math.abs(n) + "/" + d; }
function hrs(h) { return nf(h) + " h"; }
/* Construit une question : 4 options différentes, la bonne mélangée au hasard */
function mk(theme, t, correct, distractors, e, tip, fig) {
  const opts = [String(correct)];
  for (const d of distractors) { const s = String(d); if (!opts.includes(s) && opts.length < 4) opts.push(s); }
  let k = 1;
  while (opts.length < 4) { // secours : valeurs voisines
    const base = parseFloat(String(correct).replace("−", "-").replace(",", ".").replace(/[^\d.\-]/g, ""));
    const s = isNaN(base) ? String(correct) + "·" + k : String(correct).replace(/-?[\d,.]+/, nf(base + k * (k % 2 ? 1 : -1) * Math.max(1, Math.round(Math.abs(base) / 10))));
    if (!opts.includes(s)) opts.push(s); k++; if (k > 20) break;
  }
  const o = shuffleArr(opts);
  return { t, o, a: o.indexOf(String(correct)) + 1, e, tip, th: theme, fig: fig || "" };
}
const par = v => v < 0 ? "(" + nf(v) + ")" : nf(v);
const piStr = k => (k === 1 ? "" : nf(k)) + "π";
const pctLabel = c => Math.abs(c) < 1e-9 ? "Il n'a pas changé" : (c > 0 ? "Hausse de " : "Baisse de ") + nf(Math.abs(c)) + " %";

}

  const W = 520, H = 200, l = 36, r = 14, t = 14, b = 30, n = pts.length, x = i => l + (W - l - r) * i / (n - 1), y = v => t + (H - t - b) * (1 - v / 100);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Réussite par semaine">`;
  [0, 50, 100].forEach(v => { s += `<line x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="var(--muted)">${v} %</text>`; });
  const P = pts.map((p, i) => [x(i), y(p.ok / p.n * 100)]);
  s += `<path d="M${P.map(p => p.join(" ")).join(" L")} L${P[n - 1][0]} ${y(0)} L${P[0][0]} ${y(0)} Z" fill="var(--accent-soft)"/>`;
  s += `<polyline points="${P.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  P.forEach((p, i) => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === n - 1 ? 5 : 3}" fill="var(--accent)"/>`; const [, m, d] = pts[i].w.split("-"); s += `<text x="${p[0]}" y="${H - 10}" font-size="11" text-anchor="middle" fill="var(--muted)">${+d}/${+m}</text>`; });
  s += `<text x="${P[n - 1][0] - 6}" y="${P[n - 1][1] - 10}" font-size="12" text-anchor="end" fill="var(--ink)" font-weight="600">${pct(pts[n - 1].ok, pts[n - 1].n)} %</text>`;
  return s + "</svg>";
}
function viewStats() {
  const st = themeStats(30), all = Object.values(st).reduce((a, s) => ({ n: a.n + s.n, ok: a.ok + s.ok }), { n: 0, ok: 0 });
  const mcq = store.log.filter(e => MCQ.has(e.k)), qn = mcq.reduce((s, e) => s + e.n, 0), qt = mcq.reduce((s, e) => s + e.t, 0), est = estimate(), ms = mentalStats();
  let h = `<header class="ph"><span class="eyebrow">Tes résultats</span><h1>Stats</h1></header>
    <div class="stats"><div class="stat"><b>${qn}</b><span>questions de type examen faites</span></div><div class="stat"><b>${qn ? nf(qt / qn, 0) + " s" : "–"}</b><span>par question (examen : ≈ 60 s)</span></div>
    <div class="stat"><b>${all.n ? pct(all.ok, all.n) + " %" : "–"}</b><span>de réussite (30 jours)</span></div><div class="stat"><b>${streak()}</b><span>jours d'affilée</span></div></div>
    <section class="sec"><h2>Note estimée en quantitatif</h2><div class="card est">${est ? `<span class="big">≈ ${est.s}</span><span class="muted small">D'après tes ${est.n} dernières réponses (${pct(est.p * est.n, est.n)} % juste). Objectif : 132.</span>` : `<span class="muted">L'estimation apparaît après 30 questions de fiches ou d'exercices.</span>`}
      <span class="muted small">Estimation très approximative : ce n'est pas un calcul officiel du NITE. Ces exercices ne sont pas de vraies questions d'examen. Les examens NITE en conditions réelles restent la meilleure mesure.</span></div></section>
    <section class="sec"><h2>Réussite par thème (30 derniers jours)</h2>`;
  const ths = Object.keys(THEMES).filter(k => st[k]).sort((a, b) => st[a].ok / st[a].n - st[b].ok / st[b].n);
  h += ths.length ? `<div class="card stack">${ths.map((k, i) => { const s = st[k], r = s.ok / s.n; return `<div class="hbar"><span>${THEMES[k]}${i === 0 && ths.length > 1 ? ` <span class="pill low" style="font-size:11px">à travailler</span>` : ""}</span><span class="track"><i style="width:${Math.max(3, r * 100)}%;background:${lvlColor(r)}"></i></span><span class="v">${pct(s.ok, s.n)} % · ${nf(s.t / s.n, 0)} s</span></div>`; }).join("")}
      <span class="muted small">% de réussite · temps moyen par question. Le thème le plus faible est en haut.</span></div>` : `<div class="empty">Fais une fiche ou une série d'exercices pour voir tes résultats par thème.</div>`;
  h += `</section><section class="sec"><h2>Progression par semaine</h2><div class="chart">${lineSVG(weekly())}</div></section>
    <section class="sec"><h2>Calcul mental</h2>`;
  const mk_ = MENTAL.filter(m => ms[m[0]]);
  h += mk_.length ? `<div class="card stack">${mk_.map(([id, label]) => { const s = ms[id], r = s.ok / s.n; return `<div class="hbar"><span>${label}</span><span class="track"><i style="width:${Math.max(3, r * 100)}%;background:${lvlColor(r)}"></i></span><span class="v">${pct(s.ok, s.n)} % · ${nf(s.t / s.n, 1)} s</span></div>`; }).join("")}</div>` : `<div class="empty">Fais une série de calcul mental pour voir ta vitesse.</div>`;
  h += `</section><section class="sec"><div data-status>${statusHTML()}</div><a class="secondary" href="#sauvegarde">Sauvegarde et transfert de progression</a></section>`;
  app.innerHTML = h;
}

/* ---------- Sauvegarde / transfert ---------- */
const enc = o => "O132:" + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s.trim().replace(/^O132:/, "")))));
function viewBackup() {
  const other = IN_CLAUDE ? `<p>La version <b>hors ligne</b> (installable sur ton téléphone) : <a href="${SITE_URL}" target="_blank" rel="noopener">${SITE_URL.replace("https://", "")}</a></p>`
    : `<p>La version <b>Claude</b> (avec « Explique-moi autrement » et la sauvegarde sur ton compte) : <a href="${CLAUDE_URL}" target="_blank" rel="noopener">ouvrir dans Claude</a></p>`;
  app.innerHTML = `<div class="bar"><a class="back" href="#stats">← Retour</a><div class="t"><b>Sauvegarde et transfert</b></div></div>
    <div class="stack"><div data-status>${statusHTML()}</div>
    <div class="card stack small"><b>Deux versions de l'app</b>${other}<p style="margin:0">Chacune a sa propre sauvegarde en ligne. Pour passer ta progression de l'une à l'autre : copie ton code de progression ici, puis colle-le dans l'autre version. Les deux progressions sont additionnées, rien n'est perdu.</p></div>
    ${IN_CLAUDE ? "" : `<section class="sec"><h2>Code de synchronisation</h2><p class="small muted" style="margin:0">Ta progression est sauvegardée en ligne avec ce code secret. Garde-le : si tu réinstalles l'app ou changes de téléphone, colle-le ici pour tout récupérer. Ne le donne à personne.</p>
    <textarea id="sc" readonly aria-label="Code de synchronisation" style="min-height:56px">${esc(syncCode())}</textarea><button class="secondary" id="sccopy">Copier le code de synchronisation</button>
    <textarea id="scin" aria-label="Utiliser un autre code" style="min-height:56px" placeholder="Pour récupérer une sauvegarde : colle ici ton ancien code (il commence par o132-)"></textarea><button class="secondary" id="scuse">Utiliser ce code</button><span id="scmsg" class="small"></span></section>`}
    <section class="sec"><h2>1. Copier mon code de progression</h2><textarea id="out" readonly aria-label="Code de progression">${enc(store)}</textarea><button class="primary" id="copy">Copier le code</button><span id="cmsg" class="muted small"></span></section>
    <section class="sec"><h2>2. Coller un code</h2><textarea id="in" aria-label="Coller un code" placeholder="Colle ici le code copié dans l'autre version (il commence par O132:)"></textarea><button class="secondary" id="imp">Ajouter cette progression</button><span id="imsg" class="small"></span></section>
    <section class="sec" id="resetzone"><button class="linkbtn" id="reset">Effacer toute ma progression sur cette version</button></section></div>`;
  const scc = document.getElementById("sccopy"); if (scc) { scc.onclick = () => { const ta = document.getElementById("sc"); navigator.clipboard.writeText(ta.value).then(() => scc.textContent = "Code copié", () => ta.select()); };
    document.getElementById("scuse").onclick = () => { const v = document.getElementById("scin").value.trim(), m = document.getElementById("scmsg"); if (!/^o132-[0-9a-f]{48}$/.test(v)) { m.style.color = "var(--bad)"; m.textContent = "Ce code n'est pas valide."; return; } useSyncCode(v); m.style.color = "var(--ok)"; m.textContent = "Code enregistré : ta sauvegarde est en cours de récupération."; document.getElementById("sc").value = v; }; }
  document.getElementById("copy").onclick = () => { const ta = document.getElementById("out"), m = document.getElementById("cmsg");
    navigator.clipboard.writeText(ta.value).then(() => m.textContent = "Code copié.", () => { ta.select(); m.textContent = "Le code est sélectionné : copie-le avec le menu de ton téléphone."; }); };
  document.getElementById("imp").onclick = () => { const m = document.getElementById("imsg");
    try { const o = dec(document.getElementById("in").value); if (!o || !Array.isArray(o.log)) throw 0; store = merge(store, Object.assign(blank(), o)); store.upd = Date.now(); touch(); m.style.color = "var(--ok)"; m.textContent = "Progression ajoutée."; document.getElementById("out").value = enc(store); }
    catch (e) { m.style.color = "var(--bad)"; m.textContent = "Ce code n'est pas valide. Recopie-le en entier depuis l'autre version."; } };
  document.getElementById("reset").onclick = () => { document.getElementById("resetzone").innerHTML = `<div class="confirm"><span>Effacer tous les scores, cartes et réponses en cours de cette version ? Ce n'est pas réversible.</span><div class="row"><button class="danger" id="yes">Effacer</button><button class="secondary" id="no">Annuler</button></div></div>`;
    document.getElementById("yes").onclick = () => { store = blank(); store.upd = Date.now(); skipMerge = true; touch(); viewBackup(); }; document.getElementById("no").onclick = viewBackup; };
}

/* ---------- démarrage ---------- */
route();
initRemote();
if (!IN_CLAUDE && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

})();
</script>
</body></html>
